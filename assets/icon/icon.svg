<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep Royal Emerald / Companion Forest -->
    <linearGradient id="pgBg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <!-- Radiant Mint-Sage Ambient Glow -->
    <radialGradient id="pgGlow" cx="420" cy="340" r="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#34D399" stop-opacity="0.18"/>
      <stop offset="85%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>

    <!-- Edge Vignette -->
    <radialGradient id="pgVignette" cx="512" cy="512" r="740" gradientUnits="userSpaceOnUse">
      <stop offset="65%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.32"/>
    </radialGradient>

    <!-- 24K Polished Gold Pet Crest / Liontin Jejak Kaki Emas -->
    <linearGradient id="pgGold" x1="512" y1="200" x2="512" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Crisp Ivory White / Pego Chest White -->
    <linearGradient id="pgWhite" x1="512" y1="180" x2="512" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>

    <!-- Sage Green Bandana Collar Accent -->
    <linearGradient id="pgSage" x1="300" y1="200" x2="724" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#5B7F5A"/>
      <stop offset="100%" stop-color="#3E5A3D"/>
    </linearGradient>

    <!-- Warm Corgi Fur Accent -->
    <linearGradient id="pgWarm" x1="300" y1="200" x2="724" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D4A373"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>

    <!-- Inner Shield Inset (Emerald Night) -->
    <linearGradient id="pgDeepEmerald" x1="512" y1="260" x2="512" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="pgShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#021C16" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="pawShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#022C22" flood-opacity="0.6"/>
    </filter>

    <!-- Top Gloss Sheen -->
    <linearGradient id="pgSheen" x1="0" y1="0" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="pgClip"><rect width="1024" height="1024" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#pgClip)">
    <!-- Background Plates -->
    <rect width="1024" height="1024" fill="url(#pgBg)"/>
    <rect width="1024" height="1024" fill="url(#pgGlow)"/>
    <rect width="1024" height="1024" fill="url(#pgVignette)"/>

    <!-- ==================== HERO PET CARE CREST & GOLDEN PAW MEDAL ==================== -->
    <g filter="url(#pgShadow)">
      <!-- Corgi Companion Rounded Ears Silhouette at the top of crest -->
      <!-- Left Corgi Ear -->
      <path d="M 330 290 C 270 190 330 110 400 160 C 440 190 440 260 410 320 Z" 
            fill="url(#pgWarm)"/>
      <path d="M 346 270 C 304 200 344 146 390 180 C 418 202 418 250 398 290 Z" 
            fill="url(#pgWhite)" opacity="0.4"/>

      <!-- Right Corgi Ear -->
      <path d="M 694 290 C 754 190 694 110 624 160 C 584 190 584 260 614 320 Z" 
            fill="url(#pgWarm)"/>
      <path d="M 678 270 C 720 200 680 146 634 180 C 606 202 606 250 626 290 Z" 
            fill="url(#pgWhite)" opacity="0.4"/>

      <!-- Outer Protective Care Shield / Medal Frame -->
      <path d="M 512 210 Q 750 210 750 430 C 750 640 512 830 512 830 C 512 830 274 640 274 430 Q 274 210 512 210 Z" 
            fill="url(#pgGold)"/>

      <!-- Shield Inner Deep Field -->
      <path d="M 512 238 Q 722 238 722 436 C 722 626 512 798 512 798 C 512 798 302 626 302 436 Q 302 238 512 238 Z" 
            fill="url(#pgDeepEmerald)"/>

      <!-- Sage Green Bandana Collar Arch across top -->
      <path d="M 314 340 Q 512 400 710 340 L 718 388 Q 512 452 306 388 Z" 
            fill="url(#pgSage)"/>
      <circle cx="512" cy="414" r="16" fill="url(#pgGold)"/>
    </g>

    <!-- ==================== HERO GOLDEN PAW EMBLEM (CENTER) ==================== -->
    <g filter="url(#pawShadow)">
      <!-- 4 Rounded Toe Pads -->
      <!-- Toe 1 (Far Left) -->
      <ellipse cx="396" cy="466" rx="34" ry="46" transform="rotate(-24 396 466)" fill="url(#pgGold)"/>
      <!-- Toe 2 (Center Left) -->
      <ellipse cx="468" cy="426" rx="36" ry="50" transform="rotate(-8 468 426)" fill="url(#pgGold)"/>
      <!-- Toe 3 (Center Right) -->
      <ellipse cx="556" cy="426" rx="36" ry="50" transform="rotate(8 556 426)" fill="url(#pgGold)"/>
      <!-- Toe 4 (Far Right) -->
      <ellipse cx="628" cy="466" rx="34" ry="46" transform="rotate(24 628 466)" fill="url(#pgGold)"/>

      <!-- Central Main Palm Pad (Heart-Curved Paw Base) -->
      <path d="M 512 524 C 440 524 390 564 390 626 C 390 682 434 722 512 722 C 590 722 634 682 634 626 C 634 564 584 524 512 524 Z" 
            fill="url(#pgGold)"/>

      <!-- Embedded Veterinary Care Cross in Center of Main Pad -->
      <path d="M 494 572 L 530 572 L 530 608 L 566 608 L 566 644 L 530 644 L 530 680 L 494 680 L 494 644 L 458 644 L 458 608 L 494 608 Z" 
            fill="url(#pgWhite)"/>

      <!-- Inner Pad Highlight Specular -->
      <circle cx="440" cy="570" r="12" fill="#FFFFFF" opacity="0.6"/>
      <circle cx="472" cy="406" r="8" fill="#FFFFFF" opacity="0.7"/>
      <circle cx="552" cy="406" r="8" fill="#FFFFFF" opacity="0.7"/>
    </g>

    <!-- Milestone Care Sparkles -->
    <g transform="translate(240, 310)">
      <path d="M 0 -36 Q 0 0 36 0 Q 0 0 0 36 Q 0 0 -36 0 Q 0 0 0 -36 Z" fill="#FEF08A"/>
    </g>
    <g transform="translate(784, 310)">
      <path d="M 0 -36 Q 0 0 36 0 Q 0 0 0 36 Q 0 0 -36 0 Q 0 0 0 -36 Z" fill="#FEF08A"/>
    </g>

    <!-- Top Gloss Sheen -->
    <rect width="1024" height="340" fill="url(#pgSheen)"/>
  </g>
</svg>
