<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background: High-Energy Automotive Racing Amber -->
    <linearGradient id="ggBg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>

    <!-- Warm Golden Ambient Glow -->
    <radialGradient id="ggGlow" cx="512" cy="440" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDBA74" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#FB923C" stop-opacity="0.18"/>
      <stop offset="85%" stop-color="#C2410C" stop-opacity="0"/>
    </radialGradient>

    <!-- Dial Gauge Background -->
    <linearGradient id="dialBg" x1="512" y1="200" x2="512" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Polished Chrome Wrench -->
    <linearGradient id="wrenchChrome" x1="200" y1="200" x2="800" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="75%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Needle Gradient -->
    <linearGradient id="needleGrad" x1="512" y1="512" x2="710" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="dialShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="32" stdDeviation="34" flood-color="#431407" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="wrenchShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Top Gloss Sheen -->
    <linearGradient id="topSheen" x1="0" y1="0" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#ggBg)"/>
  <rect width="1024" height="1024" fill="url(#ggGlow)"/>

  <!-- ==================== TACHOMETER / SPEEDOMETER GAUGE ==================== -->
  <g filter="url(#dialShadow)">
    <!-- Outer Chrome Bezel Rim -->
    <circle cx="512" cy="512" r="284" fill="url(#dialBg)" stroke="#FFFFFF" stroke-width="12"/>
    <circle cx="512" cy="512" r="268" fill="none" stroke="#475569" stroke-width="3"/>

    <!-- Tachometer Speed Arc (Cyan -> Amber -> Redline) -->
    <path d="M 288 640 A 244 244 0 1 1 736 640" fill="none" stroke="#334155" stroke-width="20" stroke-linecap="round"/>
    <path d="M 288 640 A 244 244 0 0 1 448 288" fill="none" stroke="#38BDF8" stroke-width="20" stroke-linecap="round"/>
    <path d="M 448 288 A 244 244 0 0 1 636 332" fill="none" stroke="#F59E0B" stroke-width="20" stroke-linecap="round"/>
    <path d="M 636 332 A 244 244 0 0 1 736 640" fill="none" stroke="#EF4444" stroke-width="20" stroke-linecap="round"/>

    <!-- Precision Tick Marks -->
    <circle cx="512" cy="274" r="7" fill="#FFFFFF"/>
    <circle cx="340" cy="374" r="6" fill="#38BDF8"/>
    <circle cx="276" cy="512" r="6" fill="#38BDF8"/>
    <circle cx="684" cy="374" r="6" fill="#EF4444"/>
    <circle cx="748" cy="512" r="6" fill="#EF4444"/>
  </g>

  <!-- ==================== HERO PRECISION CHROME SERVICE WRENCH ==================== -->
  <!-- Angled across the lower center of the gauge (-36 deg) -->
  <g filter="url(#wrenchShadow)" transform="rotate(-36 512 512)">
    <!-- Wrench Shaft -->
    <rect x="220" y="492" width="584" height="40" rx="14" fill="url(#wrenchChrome)" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="320" y="504" width="384" height="16" rx="8" fill="#64748B" opacity="0.35"/>

    <!-- Left Open-Jaw Head -->
    <g transform="translate(220, 512)">
      <circle cx="-16" cy="0" r="52" fill="url(#wrenchChrome)" stroke="#FFFFFF" stroke-width="3"/>
      <polygon points="-72,-20 -16,-20 -16,20 -72,20" fill="#C2410C"/>
    </g>

    <!-- Right Box-End Ring Head -->
    <g transform="translate(804, 512)">
      <circle cx="16" cy="0" r="52" fill="url(#wrenchChrome)" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="16" cy="0" r="30" fill="#C2410C" stroke="#64748B" stroke-width="3"/>
    </g>
  </g>

  <!-- ==================== TACHOMETER NEEDLE & CENTER HUB (ON TOP) ==================== -->
  <g filter="url(#wrenchShadow)">
    <!-- Dynamic Tachometer Needle Pointing Upwards to Redline -->
    <polygon points="506,512 512,308 518,512" fill="url(#needleGrad)"/>
    <circle cx="512" cy="512" r="34" fill="#0F172A" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="512" cy="512" r="22" fill="#EF4444"/>
    <circle cx="512" cy="512" r="9" fill="#FFFFFF"/>
  </g>

  <!-- Top Sheen Gloss -->
  <rect width="1024" height="340" fill="url(#topSheen)"/>
</svg>
