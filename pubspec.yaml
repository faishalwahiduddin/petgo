name: petgo
description: "PetGo — Pet manager: profiles, care schedules, vet visits, daily care. Offline-first."
publish_to: 'none'

version: 1.0.1+2
environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  clock: ^1.1.1
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  share_plus: ^13.3.0
  path_provider: ^2.1.5
  file_picker: ^13.1.0
  package_info_plus: ^10.2.2
  web: ^1.1.1
  flutter_local_notifications: ^22.3.2
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/mascot/
    - assets/icon/

