name: Build APK + AAB + IPA

# Manual only (workflow_dispatch) — run from the Actions tab. No push/PR triggers
# (Actions minutes policy); macOS minutes are billed 10x on private repos.
on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Restore release keystore (optional)
        # Add repo secrets to get a Play-ready signed build:
        #   ANDROID_KEYSTORE_B64  — base64 of the upload .jks
        #   ANDROID_KEYSTORE_PASS — store+key password
        #   ANDROID_KEY_ALIAS     — key alias
        # Without them the build falls back to debug signing (still installable).
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASS
          keyPassword=$KEYSTORE_PASS
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload.jks
          EOF
            echo "Release keystore restored — building signed."
          else
            echo "No keystore secrets — building with debug signing fallback."
          fi

      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      # Unsigned build: verifies the iOS project compiles end-to-end.
      # A store-submittable IPA additionally needs Apple Developer signing
      # (cert + provisioning profile secrets, or use Codemagic/Xcode Cloud).
      - run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qr app-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: build/ios/iphoneos/app-unsigned.ipa
          retention-days: 14
