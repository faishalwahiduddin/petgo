name: Analyze + Test

# Cheap ubuntu-only gate (1x billing). No build_runner in this app.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  verify:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify pubspec version bump
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE"...HEAD | grep -E '^(lib/|assets/|android/|ios/|web/)'; then
            if ! git diff "$BASE"...HEAD -- pubspec.yaml | grep -qE '^\+version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+'; then
              echo "::error:: Code changes require a pubspec.yaml version bump (§VER). Run: python3 ../tools/bump_version.py petgo patch"
              exit 1
            fi
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
